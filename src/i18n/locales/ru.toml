[lore]
lines = [
  "Локальные конфликты продолжали разрастаться. В 2036 году началась полномасштабная Третья мировая война.",
  "Во время продолжавшейся российско-украинской «Тридцатилетней войны» российская сторона тайно разрабатывала средства удара высокой разрушительной силы, но так и не получила возможности провести реальное испытание.",
  "После распада США из-за тупика вокруг помощи Европе и внутренних противоречий российские силы воспользовались моментом и продвинулись до Эльбы.",
  "Долгая война усиливала внутреннее давление, а людские и материальные ресурсы истощались. Фронт здесь застыл, и прорвать его не удавалось.",
  "В 2044 году Путин скончался от болезни. Год спустя противоречия между сторонниками продолжения войны и сторонниками перемирия внутри российской армии обострились.",
  "Сторонники перемирия попытались начать переговоры. Чтобы разрушить их «иллюзию мира», сторонники продолжения войны тайно применили разработанное ранее оружие против левого берега Эльбы."
]

[aftermath]
lines = [
  "Никто не ожидал, что его разрушительная сила окажется настолько велика.",
  "Бесчисленные солдаты всех сторон и мирные жители у линии фронта в одно мгновение обратились в прах.",
  "Этот удар напрямую положил конец Третьей мировой войне."
]

[ruins]
lines = [
  "Война уничтожила почти весь оставшийся личный состав всех сторон.",
  "Война без победителя заставила людей усомниться в своих правительствах.",
  "Весь мир охватили потрясения."
]

[finale]
line_one = "Полномасштабная война окончена…"
line_two = "Что случится дальше — решать тебе."

