services:
  showcase:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-38173}:80"
    environment:
      PLATFORM_GITHUB_URL: "${PLATFORM_GITHUB_URL:-https://github.com/Team-APE-RIP/APE}"
      PLATFORM_DISCORD_URL: "${PLATFORM_DISCORD_URL:-https://discord.gg/TaNYDC6kfJ}"
      PLATFORM_QQ_URL: "${PLATFORM_QQ_URL:-https://pd.qq.com/s/clcwlblcm?b=5}"
      PLATFORM_BILIBILI_URL: "${PLATFORM_BILIBILI_URL:-https://space.bilibili.com/1220845388}"
      PLATFORM_X_URL: "${PLATFORM_X_URL:-https://x.com/TeamAPEOfficial}"
